<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRIUS WEB - Configuração de Parâmetros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-dashboard">

<!-- ============================================================
     LOADING OVERLAY
     ============================================================ -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-logo">SIRIUS WEB</div>
    <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
    <div class="loading-txt">Carregando parâmetros...</div>
</div>

<!-- ============================================================
     FUNDO ANIMADO
     ============================================================ -->
<div class="fundo"></div>
<canvas id="particulas"></canvas>

<!-- ============================================================
     APP
     ============================================================ -->
<div class="app-layout">

    <!-- menu lateral -->
    <aside class="sidebar-icones">

        <!-- Ícone/logo do módulo -->
        <div class="sidebar-modulo-logo" title="Parâmetros">⚙️</div>

        <div class="sidebar-divisor"></div>
        <!-- Espaçador empurra Voltar para o rodapé -->
        <div class="sidebar-spacer"></div>

        <div class="sidebar-divisor"></div>

        <!-- Voltar ao Menu Principal -->
        <button class="sidebar-btn btn-voltar"
                data-tooltip="Voltar ao Menu"
                onclick="window.location.href='menu-principal.html'">
            <span class="btn-icone">↩</span>
            <span class="btn-label">Voltar</span>
        </button>

    </aside>

    <div class="app">

    <!-- TOPBAR -->
    <header class="topbar">
        <a href="dashboard.html" class="topbar-logo">
            <div class="logo-badge">🚀</div>
            <div>
                <div class="logo-nome">SIRIUS WEB</div>
                <div class="logo-sub">PARÂMETROS</div>
            </div>
        </a>
        <!-- <nav class="topbar-nav">
            <a href="dashboard.html"   class="nav-link ativo">Dashboard</a>
            <a href="pedidos.html"     class="nav-link">Pedidos</a>
            <a href="produtos.html"    class="nav-link">Produtos</a>
            <a href="clientes.html"    class="nav-link">Clientes</a>
            <a href="outros-modulos.html" class="nav-link">Outros Módulos</a>
        </nav> -->

        <div class="topbar-spacer"></div>

        <div class="topbar-right">
            <div class="relogio">
                <div class="relogio-hora" id="relogioHora">00:00:00</div>
                <div class="relogio-data" id="relogioData">—</div>
            </div>
            <div class="topbar-divisor"></div>
            <div class="usuario-info">
                <div class="usuario-avatar" id="userAvatar">?</div>
                <div>
                    <div class="usuario-nome" id="userNome">Carregando...</div>
                    <div class="usuario-cargo">Usuário</div>
                </div>
            </div>
            <!--<button class="btn-sair" onclick="logout()">↩ Sair</button>-->
        </div>
    </header>

    <!-- CORPO -->
    <div class="dash-body">
        <div class="page-header">
            <div>
                <h2>🎯 Configuração de Parâmetros da Empresa</h2>
            </div>
        </div>

        <!-- Informações da Empresa -->
        <div id="empresaInfo" class="empresa-info">
            <div class="info-header">
                <h3>🏢 Empresa Atual</h3>
                <button class="btn btn-refresh" onclick="carregarEmpresaAtual()" title="Atualizar empresa">
                    🔄 Atualizar
                </button>
            </div>
            <div class="info-content">
                <div class="info-item">
                    <strong>Razão Social:</strong> <span id="empresaRazao">-</span>
                </div>
                <div class="info-item">
                    <strong>CNPJ:</strong> <span id="empresaCnpj">-</span>
                </div>
                <div class="info-item">
                    <strong>Plano:</strong> <span id="empresaPlano" class="badge">-</span>
                </div>
            </div>
        </div>

        <!-- Mensagens -->
        <div id="mensagem" class="mensagem" style="display: none;"></div>

        <!-- Loading -->
        <div id="loading" class="loading" style="display: none;">
            ⏳ Carregando parâmetros...
        </div>

        <!-- Parâmetros -->
        <div id="parametrosContainer" style="display: none;">
            <div class="toolbar">
                <h3>📋 Parâmetros Disponíveis</h3>
                <div class="toolbar-actions">
                    <button class="btn btn-secondary" onclick="resetarTodosValores()">
                        🔄 Resetar Todos para Padrão
                    </button>
                    <button class="btn btn-success" onclick="salvarTodasAlteracoes()">
                        💾 Salvar Alterações
                    </button>
                </div>
            </div>

            <!-- Grid de Parâmetros por Módulo -->
            <div id="parametrosGrid"></div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">🏢</div>
            <h3>Carregando...</h3>
        </div>
    </div><!-- /dash-body -->
</div><!-- /app -->

</div><!-- /.app-layout -->

<script src="js/libs/api.js"></script>
<script src="js/libs/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/parametros-config.js"></script>
</body>
</html>
