<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRIUS WEB – ERP</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
</head>
<body class="page-promo">
<div class="fundo fundo-erp" onclick="window.location.href='https://www.softclever.com.br'">
    <div class="deco-hexs">
        <div class="hex"></div><div class="hex gold"></div><div class="hex"></div>
        <div class="hex gold"></div><div class="hex"></div><div class="hex"></div>
        <div class="hex gold"></div><div class="hex"></div>
    </div>
    <div class="promo-badge-erp">★ Solução Completa</div>
    <div class="conteudo">
        <div class="promo-marca">SIRIUS WEB</div>
        <div class="pre-titulo">Sistema Integrado de Gestão</div>
        <h1 class="promo-titulo-erp">ERP</h1>
        <div class="subtitulo-gestao">Gestão Empresarial Completa</div>
        <div class="separador separador-erp"></div>
        <div class="chips">
            <span class="chip">Produção</span>
            <span class="chip gold-chip">Compras</span>
            <span class="chip">Vendas</span>
            <span class="chip gold-chip">Estoque</span>
            <span class="chip">Fiscal</span>
            <span class="chip gold-chip">Financeiro</span>
            <span class="chip">Expedição</span>
            <span class="chip gold-chip">Cobrança</span>
        </div>
    </div>
    <div class="rodape">
        <div class="rodape-marca">Soft Clever Informática</div>
        <a class="btn-fale btn-fale-erp" href="https://www.softclever.com.br" onclick="event.stopPropagation()">
            <span>Fale Conosco</span><span class="btn-seta">→</span>
        </a>
    </div>
    <canvas id="particulas" style="position:absolute;inset:0;pointer-events:none;z-index:5;"></canvas>
</div>
<script>
    const canvas=document.getElementById('particulas'),ctx=canvas.getContext('2d');
    function r(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
    r();window.addEventListener('resize',r);
    const ps=Array.from({length:32},()=>({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*2+0.4,vx:(Math.random()-0.5)*0.4,vy:-(Math.random()*0.6+0.2),alpha:Math.random()*0.5+0.1,cor:Math.random()>0.6?'37,99,235':Math.random()>0.5?'96,165,250':'245,158,11'}));
    function anim(){ctx.clearRect(0,0,canvas.width,canvas.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width;}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.cor},${p.alpha})`;ctx.fill();});requestAnimationFrame(anim);}
    anim();
    document.querySelector('.fundo').addEventListener('click',function(e){const d=document.createElement('div');d.style.cssText=`position:fixed;left:${e.clientX-30}px;top:${e.clientY-30}px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,0.5),transparent);pointer-events:none;z-index:9999;animation:ripple 0.5s ease forwards;`;const s=document.createElement('style');s.textContent='@keyframes ripple{from{transform:scale(1);opacity:1}to{transform:scale(6);opacity:0}}';document.head.appendChild(s);document.body.appendChild(d);setTimeout(()=>d.remove(),500);});
</script>
</body>
</html>
