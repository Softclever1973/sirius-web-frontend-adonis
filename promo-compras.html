<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRIUS WEB – Módulo Compras</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    
</head>
<body class="page-promo">
<div class="fundo fundo-compras" onclick="window.location.href='https://www.softclever.com.br'">
    <div class="deco-caixas"><div class="cx cx1"></div><div class="cx cx2"></div><div class="cx cx3"></div></div>
    <div class="promo-badge-compras">🛒 Pedido · Cotação · Recebimento</div>
    <div class="conteudo">
        <div class="promo-marca">SIRIUS WEB</div>
        <div class="pre-titulo">Módulo</div>
        <h1 class="promo-titulo-compras">COMPRAS</h1>
        <div class="separador separador-compras"></div>
        <div class="linha-texto"><span class="linha-icone">📋</span><span>Cotações e <em>aprovações</em> integradas</span></div>
        <div class="linha-texto"><span class="linha-icone">📦</span><span>Recebimento automático no estoque</span></div>
    </div>
    <div class="rodape">
        <div class="rodape-marca">Soft Clever Informática</div>
        <a class="btn-fale btn-fale-compras" href="https://www.softclever.com.br" target="_blank" onclick="event.stopPropagation()">
            <span>Fale Conosco</span><span class="btn-seta">→</span>
        </a>
    </div>
    <canvas id="particulas" style="position:absolute;inset:0;pointer-events:none;z-index:5;"></canvas>
</div>
<script>
    const canvas=document.getElementById('particulas'),ctx=canvas.getContext('2d');
    function r(){canvas.width=innerWidth;canvas.height=innerHeight;}r();window.addEventListener('resize',r);
    const pts=Array.from({length:26},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,rx:Math.random()*1.8+0.4,vx:(Math.random()-0.5)*0.4,vy:-(Math.random()*0.6+0.2),a:Math.random()*0.5+0.1,c:Math.random()>0.5?'234,179,8':'99,102,241'}));
    function an(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width;}ctx.beginPath();ctx.arc(p.x,p.y,p.rx,0,Math.PI*2);ctx.fillStyle=`rgba(${p.c},${p.a})`;ctx.fill();});requestAnimationFrame(an);}an();
</script>
</body>
</html>
