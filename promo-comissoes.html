<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRIUS WEB – Módulo Comissões</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
</head>
<body class="page-promo">
<div class="fundo fundo-comissoes" onclick="window.location.href='https://www.softclever.com.br'">

    <!-- Gráfico de linha ascendente SVG -->
    <div class="deco-grafico">
        <svg viewBox="0 0 200 130" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Área preenchida -->
            <path d="M0,110 L40,85 L80,90 L120,50 L160,35 L200,10 L200,130 L0,130 Z" fill="rgba(236,72,153,0.08)"/>
            <!-- Linha -->
            <polyline points="0,110 40,85 80,90 120,50 160,35 200,10"
                stroke="rgba(244,114,182,0.55)" stroke-width="2" stroke-linejoin="round" fill="none"/>
            <!-- Pontos -->
            <circle cx="0"   cy="110" r="4" fill="rgba(236,72,153,0.6)"/>
            <circle cx="40"  cy="85"  r="4" fill="rgba(236,72,153,0.6)"/>
            <circle cx="80"  cy="90"  r="4" fill="rgba(236,72,153,0.6)"/>
            <circle cx="120" cy="50"  r="4" fill="rgba(236,72,153,0.6)"/>
            <circle cx="160" cy="35"  r="5" fill="rgba(244,114,182,0.8)"/>
            <circle cx="200" cy="10"  r="5" fill="rgba(0,229,160,0.8)"/>
        </svg>
    </div>

    <div class="deco-trofeu"><span class="material-symbols-outlined">emoji_events</span></div>
    <div class="promo-badge-comissoes"><span class="material-symbols-outlined">gps_fixed</span> Por Vendedor · Produto · Período</div>

    <div class="conteudo">
        <div class="promo-marca">SIRIUS WEB</div>
        <div class="pre-titulo">Módulo</div>
        <h1 class="promo-titulo-comissoes">COMISSÕES</h1>
        <div class="separador separador-comissoes"></div>
        <div class="linha-texto"><span class="linha-icone"><span class="material-symbols-outlined">trending_up</span></span><span>Cálculo <em>automático</em> por vendedor</span></div>
        <div class="linha-texto"><span class="linha-icone"><span class="material-symbols-outlined">gps_fixed</span></span><span>Metas, faixas e regras personalizadas</span></div>
    </div>
    <div class="rodape">
        <div class="rodape-marca">Soft Clever Informática</div>
        <a class="btn-fale btn-fale-comissoes" href="https://www.softclever.com.br" target="_blank" onclick="event.stopPropagation()">
            <span>Fale Conosco</span><span class="btn-seta">→</span>
        </a>
    </div>
    <canvas id="particulas" data-cor1="236,72,153" data-cor2="0,229,160" style="position:absolute;inset:0;pointer-events:none;z-index:5;"></canvas>
</div>
<script src="js/promo-particles.js"></script>

</html>
